# Branch-only verification; does not install repository-wide CI or alter merge policy.
name: Verify review fixes
on:
  push:
    branches: [arena/ada59f4e-blue-boy-game]
permissions:
  contents: read
jobs:
  gradle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build, test and measure line coverage
        shell: bash
        run: ./gradlew clean build jacocoTestReport 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      - name: Diagnose failures
        if: failure()
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as xml
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP'])/'gradle.log'
          if log.exists(): print('::error::' + log.read_text()[-6000:].strip().replace('\n','%0A'))
          for path in Path('build/test-results/test').glob('TEST-*.xml'):
              for err in xml.parse(path).iter('failure'):
                  print('::error::'+str(err.text)[:1600].replace('\n','%0A')); break
          PY
      - name: Report results
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as xml
          suites = [xml.parse(path).getroot() for path in Path('build/test-results/test').glob('TEST-*.xml')]
          counts = {key: sum(int(suite.get(key, 0)) for suite in suites) for key in ('tests','failures','errors','skipped')}
          counter = xml.parse('build/reports/jacoco/test/jacocoTestReport.xml').find("counter[@type='LINE']")
          print(f'::notice::JUnit: {counts}; JaCoCo lines: {counter.attrib}')
          seams = {'PathFinder.java','PathFollower.java','Node.java','WorldNavigation.java','SpriteCache.java','WorldRenderer.java','UiFonts.java','CollisionDetector.java'}
          covered = missed = 0
          for source in xml.parse('build/reports/jacoco/test/jacocoTestReport.xml').iter('sourcefile'):
              if source.get('name') in seams:
                  lines = source.find("counter[@type='LINE']")
                  covered += int(lines.get('covered')); missed += int(lines.get('missed'))
          print(f'::notice::New/rewritten seams {sorted(seams)}: {covered} covered, {missed} missed.')
          PY
      - name: Exercise the live Swing window
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/classpath.gradle" <<'GRADLE'
          allprojects { p -> p.plugins.withId('java') {
            p.tasks.register('reviewClasspath') { doLast { println p.sourceSets.main.runtimeClasspath.asPath } }
          } }
          GRADLE
          cp=$(./gradlew -q -I "$RUNNER_TEMP/classpath.gradle" reviewClasspath)
          mkdir -p "$RUNNER_TEMP/dev"
          sed 's/^  enabled: false/  enabled: true/' src/main/resources/config.yml > "$RUNNER_TEMP/dev/config.yml"
          xvfb-run -a java -Dblueboy.dataDir="$RUNNER_TEMP/game-data" -cp "$RUNNER_TEMP/dev:$cp" .github/verification/DesktopCheck.java 2>&1 | tee "$RUNNER_TEMP/desktop.log"
      - name: Report desktop failure
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/desktop.log"; then
            python3 -c 'import os,pathlib; print("::error::"+ (pathlib.Path(os.environ["RUNNER_TEMP"])/"desktop.log").read_text()[-1500:].replace("\n","%0A"))'
          fi
      - name: Retain the real frames for visual review
        if: always() && hashFiles('build/desktop-check/*.png') != ''
        uses: actions/upload-artifact@v6
        with:
          name: chase-frames
          path: build/desktop-check/*.png

      - name: Attach compact frame previews to the verification check
        shell: bash
        run: |
          for frame in build/desktop-check/*.png; do
            preview=$(convert "$frame" -sample 320x192 PNG8:- | base64 -w0)
            echo "::notice title=Frame $(basename "$frame")::data:image/png;base64,$preview"
          done
